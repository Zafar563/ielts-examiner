services:
  postgres:
    image: postgres:16-alpine
    container_name: ielts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ielts_bot}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - ielts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ielts_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: ielts_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-ielts_bot}
      - DB_SSLMODE=disable

volumes:
  ielts_pgdata:
