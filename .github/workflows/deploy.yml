name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy IELTS Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # Project directory on server
            TARGET_DIR="$HOME/ielts_bot"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            
            # Agar papka mavjud bo'lmasa git clone qilamiz, bo'lsa git pull
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            
            echo "Pulling latest code from main branch..."
            git remote set-url origin "$REPO_URL"
            git pull origin main

            if [ ! -f ".env" ]; then
              echo "⚠️ OGOHLANTIRISH: .env fayli topilmadi! .env.example dan nusxa olinmoqda..."
              cp .env.example .env
            fi

            echo "Rebuilding and starting containers with Docker Compose..."
            docker compose down
            docker compose up -d --build

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Deployment successfully finished!"
